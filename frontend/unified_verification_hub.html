<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&amp;family=JetBrains+Mono:wght@100..800&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #0B0F1A;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(17, 19, 27, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 24px 48px -12px rgba(0, 0, 0, 0.5);
        }
        .otp-input {
            border: 1px solid rgba(141, 144, 160, 0.3);
            background: rgba(29, 31, 39, 0.4);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .otp-input:focus {
            box-shadow: 0 0 0 1px #2563EB, 0 0 15px rgba(37, 99, 235, 0.3);
            border-color: #2563EB;
            outline: none;
            background: rgba(37, 99, 235, 0.05);
        }
        .bg-glow {
            background: radial-gradient(circle at 50% 50%, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
        }
        .chart-overlay {
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
        }
        .world-map {
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            opacity: 0.03;
        }
        .step-active {
            box-shadow: 0 0 10px rgba(37, 99, 235, 0.5);
        }
    </style>
